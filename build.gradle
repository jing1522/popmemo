plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.popmemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.popmemo'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 每次编译留一份带版本号+时间戳的 APK，新包装出问题能装回旧版
def keepApk = tasks.register('keepApk') {
    doLast {
        def src = layout.buildDirectory.file("outputs/apk/debug/${project.name}-debug.apk").get().asFile
        if (!src.exists()) return
        def dir = new File('D:/popmemo-releases')
        dir.mkdirs()
        def base = "${project.name}-${android.defaultConfig.versionName}"
        boolean dup = dir.listFiles()?.any { it.name.startsWith(base) && it.length() == src.length() }
        if (dup) return
        def stamp = new java.text.SimpleDateFormat('yyyyMMdd-HHmm').format(new Date())
        def dst = new File(dir, "${base}-${stamp}.apk")
        dst.bytes = src.bytes
        println "留存 APK: ${dst}"
    }
}
tasks.matching { it.name == 'assembleDebug' }.configureEach { finalizedBy(keepApk) }

dependencies {
}
